name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run tells you nothing useful, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leads
          POSTGRES_PASSWORD: leads
          POSTGRES_DB: leads
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leads"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Types
        run: uv run pyright

      - name: Tests
        # The model marker is deselected: CI has no GPU and no weights, and a
        # suite that needs them would be skipped rather than trusted.
        run: uv run pytest -m "not model" --cov=app --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://leads:leads@localhost:5432/leads

      - name: Migrations apply and reverse cleanly
        # An irreversible migration is only discovered during a rollback,
        # which is the worst possible time.
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://leads:leads@localhost:5432/leads

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: No known vulnerabilities
        run: npm audit --audit-level=moderate

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Building both images in CI means a broken Dockerfile is caught here
      # rather than on the server during a deploy.
      - name: Build the backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
